site_name: 墜入阿弗納斯 團錄 Wiki
site_url: https://edithhsu.github.io/trpgwiki-dnd-avernus/
site_description: D&D「墜入阿弗納斯（Descent into Avernus）」戰役的劇情整理
docs_dir: docs

theme:
  name: material
  language: zh-TW
  font: false              # 用系統字型（仿 Notion），不從 Google Fonts 載入
  palette:                 # 顏色在 stylesheets/extra.css 以 Notion 色票覆寫
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: 切換為深色模式
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: 切換為淺色模式
  features:
    # 上一頁／下一頁由 hooks/notion.py 產生在內文欄底部，依 nav 順序翻頁
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.suggest
    - content.tooltips

plugins:
  - search:
      jieba_dict_user: jieba_dict.txt

hooks:
  - hooks/backlinks.py
  - hooks/notion.py        # 必須在 backlinks.py 之後

extra:
  generator: false

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - toc:
      permalink: true
      # 保留中文標題作為錨點（預設會變成 _1、_2）
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower

validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn

nav:
  - 首頁: index.md
  - 時間線: timeline.md
  - 名詞表: glossary.md
  - 集數:
